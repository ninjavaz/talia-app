# Local development database and e-mail catcher. Started by scripts\db-start.cmd (and scripts\dev.cmd).
name: talia-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: talia
      POSTGRES_USER: talia
      POSTGRES_PASSWORD: talia
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>/...
      - talia-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talia -d talia"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches all e-mails sent by the backend (nothing leaves your computer): http://localhost:8025
  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  talia-dev-data:
