spring:
  application:
    name: talia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talia}
    username: ${DB_USER:talia}
    password: ${DB_PASSWORD:talia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    # sliding: every request extends it, and the app re-issues the cookie on start (see AuthController.me)
    timeout: 365d
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  # SMTP of the e-mail provider (any provider works: Brevo, Resend, Postmark, Amazon SES...)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 365d
      # the session cookie itself is defined in SessionCookieConfig

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # the SMTP server being down must not mark the app as unhealthy
    mail:
      enabled: false

talia:
  timezone: Europe/Warsaw
  # address of the app (links in e-mails)
  public-url: ${PUBLIC_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:Talia <no-reply@localhost>}
  security:
    # failed logins: per IP and per username, refilled gradually over the window; over the limit -> 429
    login-max-failures-per-ip: 20
    login-max-failures-per-user: 8
    login-window: 15m
    # registrations and ALTCHA challenges per IP
    registrations-per-ip: 5
    registration-window: 1h
    challenges-per-ip: 60
    # account e-mails (verification, password reset): per IP and per e-mail address
    mails-per-ip: 10
    mails-per-address: 3
    mail-window: 1h
    # validity of e-mail links; unverified accounts are deleted after verify-link-ttl
    verify-link-ttl: 48h
    reset-link-ttl: 1h
    altcha:
      # PBKDF2 iterations per attempt and the upper bound of the secret counter: ~1 s on a desktop,
      # a few seconds on a phone. The widget starts when the form gets focus, so it runs while the user types.
      cost: 5000
      max-counter: 800
      ttl: 10m
      hmac-secret: ${ALTCHA_HMAC_SECRET:}
    # session cookie only over HTTPS; false only for local http development
    cookie-secure: ${COOKIE_SECURE:true}
