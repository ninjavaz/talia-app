spring:
  application:
    name: talia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talia}
    username: ${DB_USER:talia}
    password: ${DB_PASSWORD:talia}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    # sliding: every request extends it, and the app re-issues the cookie on start (see AuthController.me)
    timeout: 365d
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 365d
      # the session cookie itself is defined in SessionCookieConfig

management:
  endpoints:
    web:
      exposure:
        include: health

talia:
  timezone: Europe/Warsaw
  security:
    # failed logins: per IP and per username within the window, then 429 until the window passes
    login-max-failures-per-ip: 20
    login-max-failures-per-user: 8
    login-window: 15m
    # registration and proof-of-work challenges per IP
    registrations-per-ip: 5
    registration-window: 1h
    challenges-per-ip: 60
    # proof-of-work difficulty: the client tries on average half of this many SHA-256 hashes
    pow-max-number: 100000
    pow-ttl: 10m
    # session cookie only over HTTPS; false only for local http development
    cookie-secure: ${COOKIE_SECURE:true}
