# Local development settings (profile "dev"), used by `.\mvnw.cmd` / `spring-boot:run`.
# Lives in ./config so Spring Boot picks it up from the working directory, but it is NOT packaged into the jar.
# Database: compose.dev.yml (start with scripts\db-start.cmd). Accounts are created in the app.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/talia
    username: talia
    password: talia
  # Mailpit from compose.dev.yml catches every e-mail: http://localhost:8025
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

talia:
  security:
    cookie-secure: false
    # easier local testing
    altcha:
      max-counter: 300
